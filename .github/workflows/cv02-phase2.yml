name: CV02 phase 2
on:
  push:
    branches: [research/cv02-rsi-ema]
    paths:
      - research/cv02_phase2.py
      - .github/workflows/cv02-phase2.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python research/cv02_phase2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cv02-phase2-results
          path: cv02_*.csv
      - name: Publish research CSV
        run: |
          mkdir -p research/results
          cp cv02_phase2_summary.csv research/results/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/cv02_phase2_summary.csv
          if ! git diff --cached --quiet; then
            git commit -m "Save CV02 phase 2 summary [skip ci]"
            git push origin HEAD:research/cv02-rsi-ema
          fi
