name: StockLab validation

on:
  pull_request:
    branches: [main]
    paths:
      - "stock_app.py"
      - "stock_dashboard.py"
      - "growth_counter.py"
      - "stocklab_market_history.csv"
      - "cophieu68_import.py"
      - "requirements.txt"
      - ".github/workflows/stocklab.yml"
  push:
    branches: [main]
    paths:
      - "stock_app.py"
      - "stock_dashboard.py"
      - "growth_counter.py"
      - "cophieu68_import.py"
      - "requirements.txt"
      - ".github/workflows/stocklab.yml"
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * 1-5'

permissions:
  contents: write

# Serialize scheduled and push-triggered scans so their CSV commits cannot conflict.
concurrency:
  group: stocklab-market-scan
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile stock_app.py stock_dashboard.py cophieu68_import.py
      - name: Live Cophieu68 history smoke test
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import pandas as pd
          from cophieu68_import import fetch_cophieu68_history
          df = fetch_cophieu68_history("FPT", max_pages=2)
          required = {"symbol", "date", "open", "high", "low", "close", "volume"}
          assert required.issubset(df.columns), df.columns.tolist()
          assert len(df) >= 20, f"Too few history rows: {len(df)}"
          assert df["date"].notna().all()
          df = df.sort_values("date").copy()
          df["EMA100"] = df["close"].ewm(span=100, adjust=False, min_periods=100).mean()
          df["MOM10"] = df["close"] - df["close"].shift(10)
          df["ROC14"] = (df["close"] / df["close"].shift(14) - 1) * 100
          df["VOL20"] = df["volume"].rolling(20, min_periods=20).mean()
          latest = df.dropna(subset=["EMA100", "MOM10", "ROC14", "VOL20"]).iloc[-1]
          assert pd.notna(latest["EMA100"]) and pd.notna(latest["ROC14"]) and pd.notna(latest["VOL20"])
          print(f"Cophieu68 live test OK: {len(df)} FPT rows; latest={df['date'].max()}")
          print(f"FPT indicators: close={latest['close']:.2f}; EMA100={latest['EMA100']:.2f}; ROC14={latest['ROC14']:.2f}%; VOL20={latest['VOL20']:.0f}")
          PY
      - name: D1 chart pipeline smoke test
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          import pandas as pd
          from stock_dashboard import fetch_chart_quotes, add_indicators

          start = (date.today() - timedelta(days=365)).isoformat()
          end = date.today().isoformat()
          candles, source = fetch_chart_quotes("FPT", start, end, interval="1D")
          assert not candles.empty, "D1 chart returned no candles"
          required = {"date", "open", "high", "low", "close", "volume"}
          assert required.issubset(candles.columns), candles.columns.tolist()
          candles = candles.sort_values("date").reset_index(drop=True)
          assert candles["date"].is_monotonic_increasing, "D1 dates are not ascending"
          assert candles["date"].duplicated().sum() == 0, "Duplicate D1 dates"
          assert (candles["high"] >= candles[["open", "close", "low"]].max(axis=1)).all(), "Invalid D1 high"
          assert (candles["low"] <= candles[["open", "close", "high"]].min(axis=1)).all(), "Invalid D1 low"
          assert len(candles) >= 100, f"Need >=100 D1 candles for EMA100, got {len(candles)}"
          chart = add_indicators(candles)
          latest = chart.iloc[-1]
          for col in ("EMA20", "EMA50", "EMA100", "MOM10", "ROC14", "VOL20", "RSI14", "MACD", "MACD_SIGNAL", "MACD_HIST"):
              assert pd.notna(latest[col]), f"Latest D1 indicator missing: {col}"
          print(f"D1 pipeline OK: source={source}; candles={len(chart)}; latest={latest['date']}")
          print(f"FPT D1: close={latest['close']:.2f}; EMA20={latest['EMA20']:.2f}; EMA50={latest['EMA50']:.2f}; EMA100={latest['EMA100']:.2f}; ROC14={latest['ROC14']:.2f}%; RSI14={latest['RSI14']:.1f}; volume={latest['volume']:.0f}")
          PY
      - name: Scan daily market and persist dated snapshots
        if: github.event_name != 'pull_request'
        timeout-minutes: 90
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone
          from pathlib import Path
          import pandas as pd
          from stock_dashboard import fetch_instruments
          from cophieu68_import import fetch_cophieu68_history
          universe = fetch_instruments()
          stamp = datetime.now(timezone.utc).isoformat()
          def scan(item):
              symbol = str(item.symbol).upper()
              try:
                  hist = fetch_cophieu68_history(symbol, max_pages=15).sort_values("date").drop_duplicates("date")
                  hist = hist.dropna(subset=["close", "volume"])
                  if len(hist) < 100: raise ValueError(f"Thiếu lịch sử: {len(hist)} phiên")
                  close = pd.to_numeric(hist["close"], errors="coerce")
                  hist["EMA7"] = close.ewm(span=7, adjust=False, min_periods=7).mean()
                  hist["SMA20"] = close.rolling(20, min_periods=20).mean()
                  hist["EMA100"] = close.ewm(span=100, adjust=False, min_periods=100).mean()
                  hist["MOM10"] = close - close.shift(10)
                  hist["ROC14"] = (close / close.shift(14) - 1) * 100
                  hist["VOL20"] = hist["volume"].rolling(20, min_periods=20).mean()
                  valid = hist.dropna(subset=["EMA7", "SMA20", "EMA100", "MOM10", "ROC14", "VOL20"]).copy()
                  if valid.empty: raise ValueError("Không đủ dữ liệu chỉ báo")
                  valid["symbol"] = symbol; valid["exchange"] = str(item.exchange).upper(); valid["updated_at_utc"] = stamp
                  valid["found_mom10"] = (valid["MOM10"] >= 4) & (valid["VOL20"] >= 50000) & (valid["close"] >= valid["EMA100"])
                  valid["above_both"] = (valid["close"] > valid["EMA7"]) & (valid["close"] > valid["SMA20"])
                  return valid[["symbol","exchange","date","close","volume","EMA7","SMA20","EMA100","MOM10","ROC14","VOL20","found_mom10","above_both","updated_at_utc"]], None
              except Exception as exc: return None, f"{symbol}: {exc}"
          frames, errors = [], []
          with ThreadPoolExecutor(max_workers=12) as pool:
              futures = [pool.submit(scan, item) for item in universe.itertuples(index=False)]
              for i, future in enumerate(as_completed(futures), 1):
                  frame, error = future.result()
                  if frame is not None: frames.append(frame)
                  if error: errors.append(error)
                  if i % 50 == 0: print(f"Market scan {i}/{len(futures)}; valid={len(frames)}; errors={len(errors)}")
          if not frames: raise RuntimeError("Không có mã nào quét được; không ghi đè lịch sử")
          all_history = pd.concat(frames, ignore_index=True)
          all_history["date"] = pd.to_datetime(all_history["date"], errors="coerce").dt.strftime("%Y-%m-%d")
          history_path = Path("stocklab_market_history.csv")
          if history_path.exists(): all_history = pd.concat([pd.read_csv(history_path), all_history], ignore_index=True)
          all_history = all_history.drop_duplicates(["symbol","date"], keep="last").sort_values(["date","symbol"])
          all_history.to_csv(history_path, index=False)
          latest_date = all_history["date"].max(); latest = all_history[all_history["date"] == latest_date].copy()
          latest.to_csv("stocklab_market_all.csv", index=False)
          latest[latest["found_mom10"].astype(str).str.lower().isin(["true","1"])].to_csv("stocklab_market_passed.csv", index=False)
          print(f"DAILY MARKET SCAN COMPLETE: universe={len(universe)}; latest={latest_date}; rows={len(latest)}; history={len(all_history)}; errors={len(errors)}")
          print("Sample errors:", errors[:20])
          PY
      - name: Scan sideways stocks (60 and 120 sessions)
        if: github.event_name != 'pull_request'
        timeout-minutes: 60
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone
          import pandas as pd
          from stock_dashboard import fetch_instruments
          from cophieu68_import import fetch_cophieu68_history

          universe = fetch_instruments()
          print(f"Universe: {len(universe)} symbols across {universe['exchange'].nunique()} exchanges")

          def scan(item):
              ticker = str(item.symbol).upper()
              try:
                  # 15 pages provide a buffer for at least 120 daily candles.
                  hist = fetch_cophieu68_history(ticker, max_pages=15)
                  hist = hist.sort_values("date").drop_duplicates("date").reset_index(drop=True)
                  hist = hist.dropna(subset=["high", "low", "close"])
                  result = {}
                  for window, label in ((60, "60"), (120, "120")):
                      if len(hist) < window:
                          continue
                      part = hist.tail(window)
                      low = float(part["low"].min())
                      high = float(part["high"].max())
                      if low <= 0 or pd.isna(low) or pd.isna(high):
                          continue
                      amplitude = (high - low) / low * 100
                      if amplitude <= 5.0:
                          result[label] = {
                              "Mã CP": ticker,
                              "Sàn": str(item.exchange),
                              "Giá thấp nhất": low,
                              "Giá cao nhất": high,
                              "Biên độ %": amplitude,
                              "Giá hiện tại": float(hist.iloc[-1]["close"]),
                              "Số phiên": window,
                              "Ngày dữ liệu": pd.Timestamp(hist.iloc[-1]["date"]).strftime("%Y-%m-%d"),
                          }
                  return result, None
              except Exception as exc:
                  return {}, f"{ticker}: {exc}"

          found60, found120, errors = [], [], []
          with ThreadPoolExecutor(max_workers=12) as pool:
              futures = [pool.submit(scan, item) for item in universe.itertuples(index=False)]
              for n, future in enumerate(as_completed(futures), 1):
                  result, error = future.result()
                  if "60" in result:
                      found60.append(result["60"])
                  if "120" in result:
                      found120.append(result["120"])
                  if error:
                      errors.append(error)
                  if n % 25 == 0:
                      print(f"Progress: {n}/{len(futures)}; 60-session={len(found60)}; 120-session={len(found120)}; errors={len(errors)}")

          columns = ["Mã CP", "Sàn", "Giá thấp nhất", "Giá cao nhất", "Biên độ %", "Giá hiện tại", "Số phiên", "Ngày dữ liệu"]
          df60 = pd.DataFrame(found60, columns=columns).sort_values("Biên độ %") if found60 else pd.DataFrame(columns=columns)
          df120 = pd.DataFrame(found120, columns=columns).sort_values("Biên độ %") if found120 else pd.DataFrame(columns=columns)
          stamp = datetime.now(timezone.utc).isoformat()
          df60["updated_at_utc"] = stamp
          df120["updated_at_utc"] = stamp
          df60.to_csv("stocklab_sideways_60.csv", index=False)
          df120.to_csv("stocklab_sideways_120.csv", index=False)
          print(f"SIDEWAYS SCAN COMPLETE: scanned={len(universe)}; 60-session={len(df60)}; 120-session={len(df120)}; errors={len(errors)}")
          print("60-SESSION RESULTS:")
          print(df60.to_string(index=False))
          print("120-SESSION RESULTS:")
          print(df120.to_string(index=False))
          print("SAMPLE ERRORS:", errors[:15])
          PY
      - name: Publish latest market scan for StockLab
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocklab_market_all.csv stocklab_market_passed.csv stocklab_market_history.csv stocklab_sideways_60.csv stocklab_sideways_120.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update daily StockLab market scan"
            git fetch origin main
            # A newer code commit may update the tracked CSVs while this scan runs.
            # Keep this run's freshly generated scan outputs if those CSVs conflict.
            if ! git rebase origin/main; then
              git checkout --theirs -- stocklab_market_all.csv stocklab_market_passed.csv stocklab_market_history.csv stocklab_sideways_60.csv stocklab_sideways_120.csv
              git add stocklab_market_all.csv stocklab_market_passed.csv stocklab_market_history.csv stocklab_sideways_60.csv stocklab_sideways_120.csv
              GIT_EDITOR=true git rebase --continue
            fi
            git push origin HEAD:main
          else
            echo "Market scan files unchanged."
          fi
      - name: Check Vnstock API and sample data (optional)
        if: github.event_name != 'pull_request'
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          import os
          import vnstock
          from vnstock import Listing, Quote
          import pandas as pd

          if not os.environ.get("VNSTOCK_API_KEY"):
              print("Skipping live-data smoke test: VNSTOCK_API_KEY is not configured.")
              raise SystemExit(0)
          vnstock.login(os.environ["VNSTOCK_API_KEY"])
          listing = pd.DataFrame(Listing(source="kbs").symbols_by_exchange())
          assert {"symbol", "exchange"}.issubset(listing.columns), listing.columns.tolist()
          assert listing["exchange"].astype(str).str.upper().isin(["HOSE", "HNX", "UPCOM"]).any()

          end = date.today()
          start = end - timedelta(days=30)
          history = Quote(source="kbs", symbol="FPT").history(
              start=start.isoformat(), end=end.isoformat(), interval="1D"
          )
          assert isinstance(history, pd.DataFrame) and not history.empty
          assert {"time", "open", "high", "low", "close", "volume"}.issubset(history.columns), history.columns.tolist()
          print(f"Vnstock smoke test OK: {len(listing)} symbols; {len(history)} FPT candles")
          PY
