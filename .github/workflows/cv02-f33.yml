name: CV02 F3.3
on:
  push:
    branches: [research/cv02-rsi-ema]
    paths:
      - research/cv02_f33.py
      - .github/workflows/cv02-f33.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=.:research python research/cv02_f33.py
      - uses: actions/upload-artifact@v4
        with:
          name: cv02-f33-results
          path: cv02_f33_*.csv
      - run: |
          mkdir -p research/results
          gzip -c cv02_f33_events.csv > research/results/cv02_f33_events.csv.gz
          cp cv02_f33_holdout.csv research/results/
          for f in cv02_f33_summary.csv cv02_f33_confusion.csv; do
            if [ $(wc -c < "$f") -gt 50000000 ]; then gzip -c "$f" > "research/results/$f.gz"; else cp "$f" research/results/; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/cv02_f33_*
          if ! git diff --cached --quiet; then
            git commit -m "Save early reversal results [skip ci]"
            git push origin HEAD:research/cv02-rsi-ema
          fi
