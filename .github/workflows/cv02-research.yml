name: CV02 research
on:
  push:
    branches: [research/cv02-rsi-ema]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python research/cv02_baseline.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cv02-results
          path: cv02_*.csv
